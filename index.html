<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/spark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f2fa" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("spark-pages:theme:v1") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", dark ? "#141218" : "#f7f2fa");
          }
        } catch (error) {}
      })();
    </script>
    <style>
      html,
      body {
        background: #f7f2fa;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #141218;
      }
    </style>
    <title>Spark Pages</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
